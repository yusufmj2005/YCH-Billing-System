name: Test & build installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Lint & tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Qt system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-windows:
    name: Tests, build & installer (Windows)
    needs: test-linux
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BPOS_NOPAUSE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $paths = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          if (-not ($paths | Where-Object { Test-Path $_ })) { choco install innosetup -y --no-progress }
      - name: Test, build exe, self-test, compile installer
        shell: cmd
        run: build\build_installer.bat nopause
      - name: Install, self-test and uninstall the real installer
        shell: pwsh
        run: |
          $dir = "C:\BPOS-InstallTest"
          $p = Start-Process -Wait -PassThru "installer_output\BusinessPOS-Setup.exe" `
                 -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\BusinessPOS.exe")) { throw "BusinessPOS.exe was not installed" }
          Remove-Item "$env:TEMP\BusinessPOS-selftest.log" -ErrorAction SilentlyContinue
          $t = Start-Process -Wait -PassThru "$dir\BusinessPOS.exe" -ArgumentList "--self-test"
          Get-Content "$env:TEMP\BusinessPOS-selftest.log"
          if ($t.ExitCode -ne 0) { throw "Installed application self-test failed" }
          $u = Start-Process -Wait -PassThru "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with $($u.ExitCode)" }
          if (Test-Path "$dir\BusinessPOS.exe") { throw "Uninstall left the program behind" }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash installer_output\BusinessPOS-Setup.exe -Algorithm SHA256).Hash
          "$h  BusinessPOS-Setup.exe" | Out-File -Encoding ascii installer_output\BusinessPOS-Setup.exe.sha256
          Get-Content installer_output\BusinessPOS-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BusinessPOS-Setup
          path: |
            installer_output/BusinessPOS-Setup.exe
            installer_output/BusinessPOS-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BusinessPOS-Setup
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BusinessPOS-Setup.exe
            BusinessPOS-Setup.exe.sha256
          generate_release_notes: true
